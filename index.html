
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>福祉用具貸出管理システム</title>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --brand: #285777;
      --brand-dark: #1d405a;
      --accent: #3b8190;
      --bg: #f5f7f9;
      --surface: #fff;
      --border: #e2e8ee;
      --text: #263746;
      --muted: #718096;
      --success: #26734d;
      --danger: #b33d3d;
      --warning: #9a6b20;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans JP", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    button, select { font: inherit; }

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 64px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1200px;
      height: 100%;
      margin: auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 16px;
      font-weight: 700;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: white;
      border-radius: 9px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--success);
      font-size: 12px;
      font-weight: 600;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      background: #39976a;
      border-radius: 50%;
    }

    .menu-button {
      display: none;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 24px 60px;
    }

    .breadcrumb {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 22px;
    }

    .page-heading {
      margin-bottom: 26px;
    }

    .page-heading h1 {
      margin: 0 0 6px;
      font-size: 25px;
      letter-spacing: -.5px;
    }

    .page-heading p {
      color: var(--muted);
      margin: 0;
    }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 20px;
      margin-bottom: 22px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .field {
      width: 100%;
      max-width: 350px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .select-wrap {
      position: relative;
    }

    select {
      width: 100%;
      height: 44px;
      padding: 0 38px 0 13px;
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(40,87,119,.10);
    }

    .select-wrap i {
      position: absolute;
      right: 12px;
      top: 13px;
      pointer-events: none;
      color: var(--muted);
      width: 17px;
      height: 17px;
    }

    .refresh-button {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--brand);
      font-weight: 600;
      cursor: pointer;
    }

    .refresh-button:hover {
      background: #f3f7fa;
    }

    .refresh-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 26px;
    }

    .summary-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 19px 20px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-number {
      margin-top: 5px;
      font-size: 27px;
      font-weight: 700;
      color: var(--brand);
      font-variant-numeric: tabular-nums;
    }

    .summary-unit {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 16px;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .inventory-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .inventory-table th {
      padding: 15px 18px;
      background: #f8fafb;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .inventory-table td {
      padding: 18px;
      border-bottom: 1px solid #edf0f3;
    }

    .inventory-table tbody tr:last-child td {
      border-bottom: none;
    }

    .item-name {
      font-weight: 600;
    }

    .number {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .available-number {
  color: var(--success);
  font-size: 16px;
}

/* 在庫調整用の入力欄 */
.stock-total-input {
  width: 85px;
  height: 38px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font: inherit;
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.stock-total-input:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(40,87,119,.10);
}

.stock-total-input.invalid {
  border-color: var(--danger);
  background: #fff0f0;
}

.stock-edit-available {
  color: var(--success);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stock-edit-available.invalid {
  color: var(--danger);
}

    .unit {
      color: var(--muted);
      font-size: 11px;
      margin-left: 3px;
    }

    .stock-summary {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    .status-area {
      margin-top: 20px;
      padding: 13px 15px;
      background: #edf7f1;
      color: var(--success);
      border: 1px solid #d6eadd;
      border-radius: 9px;
      font-size: 12px;
    }

    .status-area.error {
      background: #fff0f0;
      border-color: #f0cccc;
      color: var(--danger);
    }

    .skeleton {
      height: 17px;
      margin: 6px 0;
      border-radius: 5px;
      background: linear-gradient(
        90deg, #edf0f3 25%, #f7f8fa 50%, #edf0f3 75%
      );
      background-size: 200% 100%;
      animation: loading 1.4s infinite;
    }

    @keyframes loading {
      to { background-position: -200% 0; }
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      max-width: min(380px, calc(100% - 32px));
      padding: 14px 18px;
      background: #263746;
      color: white;
      border-radius: 9px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(20,35,48,.35);
    }

    .drawer-overlay.open {
      display: block;
    }

    .drawer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(300px, 85vw);
      background: white;
      padding: 22px;
      transform: translateX(100%);
      transition: transform .25s ease;
    }

    .drawer-overlay.open .drawer {
      transform: translateX(0);
    }

    .drawer-title {
      font-weight: 700;
      margin-bottom: 22px;
    }

    .drawer-link {
      display: block;
      padding: 12px 10px;
      border-radius: 7px;
      color: var(--text);
      text-decoration: none;
    }

    .drawer-link:hover {
      background: #f3f6f8;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 0 16px;
      }

      .menu-button {
        display: grid;
        place-items: center;
      }

      .container {
        padding: 22px 16px 40px;
      }

      .page-heading h1 {
        font-size: 21px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .field {
        max-width: none;
      }

      .refresh-button {
        justify-content: center;
      }

      .summary {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .summary-card {
        padding: 13px 17px;
      }

      .summary-number {
        font-size: 23px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .inventory-table {
        min-width: 620px;
      }

      .connection {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <i data-lucide="clipboard-list"></i>
      </div>
      <span>福祉用具貸出管理</span>
    </div>

    <div class="header-right">
      <div class="connection" id="connection">
        <span class="connection-dot"></span>
        <span>接続確認中</span>
      </div>
      <button class="menu-button" id="menuButton"
        aria-label="メニューを開く">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay">
  <nav class="drawer">
    <div class="drawer-title">メニュー</div>
    <a class="drawer-link" href="#inventory"
      onclick="closeDrawer()">在庫管理</a>
    <a class="drawer-link" href="#summary"
      onclick="closeDrawer()">在庫概要</a>
    <a class="drawer-link" href="#footer"
      onclick="closeDrawer()">システム情報</a>
  </nav>
</div>

<main class="container">

  <div class="breadcrumb">
    ホーム / 在庫管理
  </div>

  <div class="page-heading">
    <h1>在庫管理</h1>
    <p>拠点ごとの福祉用具の保有状況を確認できます。</p>
  </div>

  <section class="toolbar">
    <div class="field">
      <label for="branchSelect">管理する拠点</label>
      <div class="select-wrap">
        <select id="branchSelect" disabled>
          <option value="">拠点情報を読み込み中...</option>
        </select>
        <i data-lucide="chevron-down"></i>
      </div>
    </div>

    <button class="refresh-button" id="refreshButton" disabled>
      <i data-lucide="refresh-cw"></i>
      在庫を再読み込み
    </button>
  </section>

  <section class="summary" id="summary">
    <div class="summary-card">
      <div class="summary-label">総在庫数</div>
      <div class="summary-number">
        <span id="totalCount">－</span>
        <span class="summary-unit">点</span>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">貸出中</div>
      <div class="summary-number">
        <span id="loanedCount">－</span>
        <span class="summary-unit">点</span>
      </div>
    </div>

    <div class="summary-card">
      <div class="summary-label">利用可能</div>
      <div class="summary-number">
        <span id="availableCount">－</span>
        <span class="summary-unit">点</span>
      </div>
    </div>
  </section>

  <section id="inventory">
    <div class="section-heading">
      <h2>物品別在庫一覧</h2>
      <span id="branchLabel">拠点を選択してください</span>
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table class="inventory-table">
          <thead>
            <tr>
              <th>福祉用具</th>
              <th>総在庫</th>
              <th>貸出中</th>
              <th>整備中</th>
              <th>利用可能</th>
            </tr>
          </thead>
          <tbody id="inventoryBody">
            <tr>
              <td colspan="5">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="stockEditor" style="margin-top: 28px;">
    <div class="section-heading">
      <h2>在庫数の調整</h2>
      <span>拠点ごとに登録</span>
    </div>

    <div class="panel" style="padding: 20px;">
      <p style="margin-top: 0; color: var(--muted);">
        実際の保有数を入力してください。
        利用可能数は自動計算します。
      </p>

      <div class="table-wrap">
        <table class="inventory-table">
          <thead>
            <tr>
              <th>福祉用具</th>
              <th>総在庫数</th>
              <th>貸出中</th>
              <th>整備中</th>
              <th>利用可能</th>
            </tr>
          </thead>
          <tbody id="stockEditBody">
            <tr>
              <td colspan="5">
                在庫情報を読み込んでいます。
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div style="margin-top: 18px;">
        <label for="stockNote"
          style="display:block; margin-bottom:7px; font-weight:600;">
          備考（任意）
        </label>
        <input
          id="stockNote"
          type="text"
          placeholder="例：初回の実数確認"
          style="width:100%; max-width:500px; height:44px;
          padding:0 12px; border:1px solid var(--border);
          border-radius:8px;"
        >
      </div>

      <div style="margin-top:20px; text-align:right;">
        <button
          id="saveStockButton"
          class="refresh-button"
          type="button"
          disabled
        >
          在庫数を確認して保存
        </button>
      </div>
    </div>
  </section>
  <div class="status-area" id="status">
    データを取得しています。
  </div>

  <div class="footer" id="footer">
    福祉用具無料貸出事業 管理システム
  </div>

</main>

<div class="toast" id="toast" role="status"></div>

<script>
  // =====================================
  // API設定
  // =====================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwF5pM0Pw3BbVhX79LQL9EzuFTnl8CIxWGmqZFWHC8vF1Ye8s0xa8c4hqJas0P-q478zA/exec";

  let currentBranchId = "";
  let requestTimer = null;
  let toastTimer = null;
  let requestNumber = 0;

  const branchSelect =
    document.getElementById("branchSelect");

  const refreshButton =
    document.getElementById("refreshButton");


  // =====================================
  // 初期化
  // =====================================

  document.addEventListener("DOMContentLoaded", () => {

    if (window.lucide) {
      lucide.createIcons();
    }

    document.getElementById("menuButton")
      .addEventListener("click", openDrawer);

    document.getElementById("drawerOverlay")
      .addEventListener("click", event => {
        if (event.target.id === "drawerOverlay") {
          closeDrawer();
        }
      });

    branchSelect.addEventListener("change", () => {
      currentBranchId = branchSelect.value;
      loadInventory(currentBranchId);
    });

    refreshButton.addEventListener("click", () => {
      loadInventory(currentBranchId);
    });

    loadMasterData();

  });


  // =====================================
  // ドロワー
  // =====================================

  function openDrawer() {
    document.getElementById("drawerOverlay")
      .classList.add("open");
  }

  function closeDrawer() {
    document.getElementById("drawerOverlay")
      .classList.remove("open");
  }


  // =====================================
  // マスターデータ取得
  // =====================================

  function loadMasterData() {

    setConnection("接続中");

    callApi(
      {
        action: "masterData"
      },
      data => {

        if (!data || data.success !== true) {
          showError(data?.message || "マスター取得に失敗しました。");
          return;
        }

        if (!Array.isArray(data.bases) || data.bases.length === 0) {
          showError("有効な拠点が登録されていません。");
          return;
        }

        branchSelect.replaceChildren();

        data.bases.forEach(base => {

          const option = document.createElement("option");
          option.value = base.id;
          option.textContent = base.name;

          branchSelect.appendChild(option);

        });

        branchSelect.disabled = false;
        refreshButton.disabled = false;

        // 初期表示は中央区があれば中央区
        const central = data.bases.find(
          base => base.id === "B001"
        );

        currentBranchId = central
          ? central.id
          : data.bases[0].id;

        branchSelect.value = currentBranchId;

        loadInventory(currentBranchId);

      }
    );

  }


  // =====================================
  // 在庫データ取得
  // =====================================

  function loadInventory(branchId) {

    if (!branchId) return;

    showSkeleton();

    setConnection("接続中");

    refreshButton.disabled = true;

    callApi(
      {
        action: "inventory",
        branchId: branchId
      },
      data => {

        refreshButton.disabled = false;

        if (!data || data.success !== true) {
          showError(data?.message || "在庫取得に失敗しました。");
          return;
        }

        renderInventory(data);

        setConnection("接続中");

        showStatus(
          data.branchName + "の在庫情報を取得しました。"
        );

        showToast("在庫情報を更新しました。");

      }
    );

  }


  // =====================================
  // JSONP通信共通処理
  // =====================================

  function callApi(params, successCallback) {

    const requestId = ++requestNumber;

    clearTimeout(requestTimer);

    // 古い通信の結果を無視するための番号
    const callbackName = "apiCallback_" + requestId;

    const query = new URLSearchParams({
      ...params,
      callback: callbackName,
      t: Date.now()
    });

    const script = document.createElement("script");

    let completed = false;

    window[callbackName] = data => {

      if (completed) return;

      completed = true;

      clearTimeout(requestTimer);

      script.remove();

      delete window[callbackName];

      successCallback(data);

    };

    script.onerror = () => {

      if (completed) return;

      completed = true;

      clearTimeout(requestTimer);

      script.remove();

      delete window[callbackName];

      showError("GASとの通信に失敗しました。");

    };

    script.src = API_URL + "?" + query.toString();

    document.body.appendChild(script);

    requestTimer = setTimeout(() => {

      if (completed) return;

      completed = true;

      script.remove();

      delete window[callbackName];

      showError("通信がタイムアウトしました。");

    }, 15000);

  }


  // =====================================
  // 在庫画面描画
  // =====================================

  function renderInventory(data) {

    const body =
      document.getElementById("inventoryBody");

    body.replaceChildren();

    let total = 0;
    let loaned = 0;
    let available = 0;

    document.getElementById("branchLabel")
      .textContent = data.branchName;

    data.inventory.forEach(item => {

      total += item.total;
      loaned += item.loaned;
      available += item.available;

      const row = document.createElement("tr");

      const values = [
        { text: item.itemName, className: "item-name" },
        { text: item.total, className: "number" },
        { text: item.loaned, className: "number" },
        { text: item.repair, className: "number" },
        { text: item.available, className: "number available-number" }
      ];

      values.forEach(value => {

        const cell = document.createElement("td");
        const span = document.createElement("span");

        span.textContent = value.text;
        span.className = value.className;

        cell.appendChild(span);

        const unit = document.createElement("span");
        unit.textContent = "点";
        unit.className = "unit";

        cell.appendChild(unit);

        row.appendChild(cell);

      });

      body.appendChild(row);

    });

    document.getElementById("totalCount")
  .textContent = total;

document.getElementById("loanedCount")
  .textContent = loaned;

document.getElementById("availableCount")
  .textContent = available;

// 在庫調整欄にもデータを表示
renderStockEditor(data);

}
　
  // =====================================
  // 在庫調整欄の描画
  // =====================================

  function renderStockEditor(data) {

    const body = document.getElementById("stockEditBody");

    body.replaceChildren();

    data.inventory.forEach(item => {

      const row = document.createElement("tr");

      // 物品名
      const nameCell = document.createElement("td");
      const name = document.createElement("span");

      name.textContent = item.itemName;
      name.className = "item-name";

      nameCell.appendChild(name);

      // 総在庫数：入力可能
      const totalCell = document.createElement("td");
      const totalInput = document.createElement("input");

      totalInput.type = "number";
      totalInput.min = "0";
      totalInput.step = "1";
      totalInput.value = item.total;
      totalInput.className = "stock-total-input";
      totalInput.dataset.itemId = item.itemId;
      totalInput.setAttribute(
        "aria-label",
        item.itemName + "の総在庫数"
      );

      totalCell.appendChild(totalInput);

      // 貸出中：表示のみ
      const loanedCell = document.createElement("td");

      loanedCell.textContent = item.loaned + " 点";

      // 整備中：表示のみ
      const repairCell = document.createElement("td");

      repairCell.textContent = item.repair + " 点";

      // 利用可能数：自動計算
      const availableCell = document.createElement("td");
      const availableValue = document.createElement("span");

      availableValue.className = "stock-edit-available";
      availableValue.textContent =
        item.total - item.loaned - item.repair;

      availableCell.appendChild(availableValue);

      // 入力時に利用可能数を再計算
      totalInput.addEventListener("input", () => {

        updateStockAvailable(
          totalInput,
          item.loaned,
          item.repair,
          availableValue
        );

      });

      row.append(
        nameCell,
        totalCell,
        loanedCell,
        repairCell,
        availableCell
      );

      body.appendChild(row);

    });

  }


  // =====================================
  // 利用可能数の自動計算
  // =====================================

  function updateStockAvailable(
    input,
    loaned,
    repair,
    availableElement
  ) {

    const total = input.value === ""
      ? NaN
      : Number(input.value);

    const valid =
      Number.isSafeInteger(total) &&
      total >= 0 &&
      total >= loaned + repair;

    input.classList.toggle("invalid", !valid);

    availableElement.classList.toggle("invalid", !valid);

    if (!valid) {

      availableElement.textContent = "入力確認";

      return;

    }

    availableElement.textContent =
      total - loaned - repair;

  }

  // =====================================
  // スケルトン表示
  // =====================================

  function showSkeleton() {

    const body =
      document.getElementById("inventoryBody");

    body.innerHTML = `
      <tr>
        <td colspan="5">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </td>
      </tr>
    `;

    document.getElementById("branchLabel")
      .textContent = "読み込み中";

  }


  // =====================================
  // 通知・状態表示
  // =====================================

  function setConnection(message) {

    const connection =
      document.getElementById("connection");

    connection.replaceChildren();

    const dot = document.createElement("span");
    dot.className = "connection-dot";

    const label = document.createElement("span");
    label.textContent = message;

    connection.append(dot, label);

  }


  function showStatus(message) {

    const status = document.getElementById("status");

    status.className = "status-area";
    status.textContent = message;

  }


  function showError(message) {

    const status = document.getElementById("status");

    status.className = "status-area error";
    status.textContent = message;

    setConnection("接続エラー");

    refreshButton.disabled = false;

    showToast(message);

  }


  function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 3500);

  }

</script>

</body>
</html>
