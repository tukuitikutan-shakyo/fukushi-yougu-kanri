
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福祉用具貸出管理システム</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      color: #333;
    }
    header {
      background: #234f73;
      color: white;
      padding: 20px;
      border-radius: 10px;
    }
    main {
      max-width: 600px;
      margin: 24px auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
    }
    #status {
      padding: 14px;
      border-radius: 8px;
      background: #eee;
    }
    .success {
      background: #d9f5df !important;
      color: #17652b;
    }
    .error {
      background: #ffe0e0 !important;
      color: #a00000;
    }
  </style>
</head>
<body>
  <header>
    <h1>福祉用具貸出管理システム</h1>
    <p>福祉用具無料貸出事業</p>
  </header>

  <main>
    <h2>システム接続テスト</h2>
    <p>Google Apps Scriptとの接続を確認しています。</p>
    <div id="status">接続確認中...</div>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwF5pM0Pw3BbVhX79LQL9EzuFTnl8CIxWGmqZFWHC8vF1Ye8s0xa8c4hqJas0P-q478zA/exec";

    function receiveApiResponse(data) {
      const status = document.getElementById("status");

      if (data && data.success === true) {
        status.className = "success";
        status.textContent =
          "接続成功！ " + data.message;
      } else {
        status.className = "error";
        status.textContent = "接続エラー：応答内容を確認してください。";
      }
    }

    function connectApi() {
      const status = document.getElementById("status");
      const script = document.createElement("script");

      status.textContent = "接続確認中...";

      script.src =
        API_URL + "?callback=receiveApiResponse";

      script.onerror = function() {
        status.className = "error";
        status.textContent =
          "接続失敗：GASの応答を取得できませんでした。";
      };

      document.body.appendChild(script);
    }

    connectApi();
  </script>
</body>
</html>
